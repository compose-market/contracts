[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true

# RPC Endpoints
[rpc_endpoints]
cronos-testnet = "${CRONOS_TESTNET_RPC}"
cronos = "${CRONOS_MAINNET_RPC}"
fuji = "${AVALANCHE_FUJI_RPC}"
mainnet = "${AVALANCHE_MAINNET_RPC}"

# Etherscan/Snowtrace verification
[etherscan]
fuji = { key = "${SNOWTRACE_API_KEY}", url = "https://api-testnet.snowtrace.io/api" }
avalanche = { key = "${SNOWTRACE_API_KEY}", url = "https://api.snowtrace.io/api" }

# Formatter
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"

# Testing
[fuzz]
runs = 256
max_test_rejects = 65536

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
